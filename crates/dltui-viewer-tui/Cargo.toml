[package]
name = "dltui-viewer-tui"
description = "TUI of the application"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"

dltui-viewer-dlp = { version = "0.1.0", path = "../dltui-viewer-dlp" }
dltui-viewer-dlt = { version = "0.1.0", path = "../dltui-viewer-dlt" }
textwrap = { version = "0.16.2", features = ["hyphenation"] }
hyphenation = { version = "0.8.4", features = ["embed_all", "embed_en-us"] }
